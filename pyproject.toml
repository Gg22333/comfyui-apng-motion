[project]
name = "comfyui-apng-motion"
version = "1.2.0"
description = "24-frame coherent APNG/WebP/GIF skill and toolkit for ComfyUI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["Pillow>=9.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py39"
exclude = ["assets", "dist", "profiles"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
