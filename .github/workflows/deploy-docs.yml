name: Docs

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README*.md"
      - "workflows/**"
      - "assets/**"
      - "scripts/sync_workflows.py"
      - "requirements-docs.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Mirror workflows and presets into docs/assets
        run: python scripts/sync_workflows.py
      - run: pip install -r requirements-docs.txt
      - run: mkdocs gh-deploy --force
